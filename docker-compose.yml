# UniCare - entorno de DESARROLLO.
# Servicios: web, db (PostgreSQL), redis, worker, beat.
# Ninguna credencial esta escrita aqui: todo viene de .env (ver .env.example).

name: unicare

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/development.txt
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    entrypoint: []
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - .:/app
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/development.txt
    command: ["worker"]
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - .:/app
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/development.txt
    command: ["beat"]
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - .:/app
    depends_on:
      redis: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
