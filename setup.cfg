# Flake8 no lee pyproject.toml. Se mantiene alineado con Black y Ruff.
[flake8]
max-line-length = 88
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    */migrations/*,
    .venv,
    venv,
    staticfiles

# `from .base import *` es el patron deliberado de settings por entorno, y en
# `testing` los defaults deben fijarse ANTES de importar `base`.
per-file-ignores =
    config/settings/development.py:F401,F403,F405
    config/settings/production.py:F401,F403,F405
    config/settings/testing.py:F401,F403,F405,E402
